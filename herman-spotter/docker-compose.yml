version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: herman-spotter_web_1
      APP_PORT: 3000
      # Umbrel login stays on for everything else. Browsers may fetch PWA icons
      # and the manifest without cookies, so those static files are exempt.
      PROXY_AUTH_WHITELIST: "/manifest.webmanifest,/icons/*"

  web:
    # The release workflow fills in the image digest (scripts/bump-store.mjs).
    image: ghcr.io/mherman1990/spotter:0.3.2@sha256:490a5bce40ceec03f735d4ffac1235850e5a6fd1a8f822b9dea26e931d06e93d
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: America/Chicago
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
