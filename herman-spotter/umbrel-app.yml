manifestVersion: 1
id: herman-spotter
name: Spotter
tagline: Strength training log and coach that lives on your Umbrel
icon: https://raw.githubusercontent.com/mherman1990/spotter-umbrel-store/main/herman-spotter/icon.svg
category: health
version: "0.8.0"
port: 3417
description: >-
  Spotter is a self-hosted strength-training tracker with an AI coach.
  Training history, media, and settings stay in this app's data folder on
  your Umbrel. The only outside service is the Anthropic API, using a key
  you add in Settings.


  Features:

  - Log sets fast from your phone at the gym; sets save on the phone first
  and sync when the connection allows

  - Progression targets, PRs, e1RM trends, and weekly volume per muscle

  - Coach chat grounded in your training history, with substitutions that
  respect your equipment and injuries

  - Form review from videos and photos of your sets, with rep-timestamped
  cues; body tracking on the Umbrel counts reps and measures depth, joint
  angles, tempo and bar path, drawn over the video

  - Compare two clips of the same lift side by side

  - Training blocks you build or the coach designs, with weekly reviews
  and block retrospectives

  - Optional Strava and TrainingPeaks import so riding load counts toward
  fatigue; Strong and Hevy history import

  - A training calendar and structured trainer rides, sent to Wahoo or
  Garmin through intervals.icu


  For gym access away from home, use the Tailscale app on your Umbrel.
developer: Matt Herman
website: https://github.com/mherman1990/spotter
repo: https://github.com/mherman1990/spotter
support: https://github.com/mherman1990/spotter/issues
gallery:
  - https://raw.githubusercontent.com/mherman1990/spotter-umbrel-store/main/herman-spotter/gallery/1.jpg
  - https://raw.githubusercontent.com/mherman1990/spotter-umbrel-store/main/herman-spotter/gallery/2.jpg
  - https://raw.githubusercontent.com/mherman1990/spotter-umbrel-store/main/herman-spotter/gallery/3.jpg
path: ""
dependencies: []
defaultUsername: ""
defaultPassword: ""
storage:
  dataRoot: data
backupIgnore:
  - data/backups/*
  - data/exports/*
  - data/media/tmp/*
releaseNotes: >-
  Body tracking for form videos. Spotter now finds your joints in each
  clip on the Umbrel itself (nothing leaves the box), counts reps, and
  measures depth, hip and knee angles, tempo, pauses, bar path and
  left/right differences. The skeleton and bar path are drawn over the
  video and can be switched off. The coach's form review uses these
  numbers and picks frames at each rep's bottom and lockout. A new compare
  view plays two clips of the same lift side by side, lined up on the
  first rep. Tracking takes a minute or two per clip on a Pi 5 and can be
  turned off in Settings → Media.
submitter: Matt Herman
submission: https://github.com/mherman1990/spotter
